name: Build albus (msm8953) mainline kernel + Debian rootfs

on:
  push:
    branches: [mainline]
  workflow_dispatch:
    inputs:
      force_kernel:
        description: 'Force kernel rebuild even if cached'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Kernel build chain: kernel.sh -> out/ (Image, dtb, modules-*, boot.img),
      # consumed by scripts/rootfs.sh. Persist out/ keyed on the kernel inputs
      # (patches + kernel.sh, which also pins the base commit); a rebuild only
      # happens when those inputs change or force_kernel is set.
      - name: Restore cached kernel build
        id: kcache
        uses: actions/cache@v4
        with:
          path: out/
          key: albus-kernel-${{ hashFiles('patches/**', 'scripts/kernel.sh') }}-v1

      - name: Install toolchain
        # debootstrap/e2fsprogs etc. are needed by the rootfs step even when
        # the kernel came from cache, so this is unconditional.
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison flex gcc-aarch64-linux-gnu git gzip libssl-dev make python3 debootstrap e2fsprogs kmod debian-archive-keyring openssh-client

      - name: Build kernel, dtbs, modules and boot.img
        if: steps.kcache.outputs.cache-hit != 'true' || inputs.force_kernel == true
        run: ./scripts/kernel.sh

      - name: Verify kernel artifacts present (cached or built)
        run: |
          ls "$(ls -d out/modules-* | head -n1)" > /dev/null
          test -s out/boot.img
          test -s out/Image.gz
          test -s out/msm8953-motorola-albus.dtb

      # Uploaded before the rootfs step so a rootfs failure never loses the
      # kernel artifacts; the rootfs step consumes out/modules-*.
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: albus-kernel
          if-no-files-found: error
          path: |
            out/boot.img
            out/boot.img.sha256
            out/Image.gz
            out/msm8953-motorola-albus.dtb
            out/modules.tar.gz
            out/kernel-release.txt

      - name: Build Debian rootfs image (debian-albus.ext4)
        # debootstrap and mount -o loop need real root; runners get passwordless sudo
        run: sudo ./scripts/rootfs.sh

      - name: Upload full artifacts (boot.img + Debian rootfs image)
        uses: actions/upload-artifact@v4
        with:
          name: albus-mainline
          if-no-files-found: error
          path: |
            out/boot.img
            out/boot.img.sha256
            out/Image.gz
            out/msm8953-motorola-albus.dtb
            out/modules.tar.gz
            out/kernel-release.txt
            out/debian-albus.ext4.gz
            out/debian-albus.ext4.gz.sha256
