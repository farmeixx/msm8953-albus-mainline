name: Build albus (Moto Z2 Play) Debian rootfs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: albus-debian
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Branch sanity
        run: |
          test -e sh/build.sh || {
            echo "Run this workflow on the 'debian' branch (it carries sh/ and conf/)."; exit 1
          }

      - name: Install Debian rootfs toolchain
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq mmdebstrap debian-archive-keyring \
            qemu-user-static binfmt-support e2fsprogs kmod zstd gzip curl git

      - name: Install current Debian archive keyring
        run: |
          keyring="$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -oE 'debian-archive-keyring_[0-9][^"<]*_all\.deb' | sort -V | tail -1)"
          test -n "$keyring"
          curl -fsSL "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$keyring" \
            -o /tmp/debian-archive-keyring.deb
          sudo dpkg -i /tmp/debian-archive-keyring.deb

      - name: Fetch the latest mainline kernel artifact
        run: bash sh/fetch-kernel.sh

      - name: Build the Debian rootfs image (debian-albus.ext4)
        run: |
          sudo env OUT_DIR="$PWD/out" \
            KERNEL_MODULES_ARCHIVE="$PWD/.work/kernel/modules.tar.gz" \
            KERNEL_RELEASE="$(cat .work/kernel/kernel-release.txt)" \
            bash sh/build.sh

      - name: Package the timestamped debian + boot image
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M%S)"
          sudo test -s out/debian-albus.ext4
          sudo mv out/debian-albus.ext4 "out/debian-$TS.ext4"
          sudo cp .work/kernel/boot.img "out/albus-$TS-mainline.img"
          sudo sh -c "cd out && sha256sum 'debian-$TS.ext4' 'albus-$TS-mainline.img' > SHA256SUMS.txt"
          # build.sh runs under sudo (mkfs needs root), so out/ and the image
          # are root-owned; hand them back to the runner for the upload step.
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### dist (artifact download = \`debian.zip\`)"
            echo ""
            echo "- \`debian-$TS.ext4\` — \`fastboot flash userdata debian-$TS.ext4\`"
            echo "- \`albus-$TS-mainline.img\` — \`fastboot flash boot albus-$TS-mainline.img\`"
            echo "- \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian
          if-no-files-found: error
          path: |
            out/debian-*.ext4
            out/albus-*-mainline.img
            out/SHA256SUMS.txt
