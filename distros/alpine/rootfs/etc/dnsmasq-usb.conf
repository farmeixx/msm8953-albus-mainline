# DHCP only for the Moto Z2 Play (albus) USB RNDIS management link.
port=0
no-resolv
no-hosts
interface=usb0
bind-interfaces
dhcp-authoritative
dhcp-range=10.15.0.50,10.15.0.200,255.255.255.0,12h

# The USB link is management-only; do not advertise a gateway or DNS server.
dhcp-option=3
dhcp-option=6
