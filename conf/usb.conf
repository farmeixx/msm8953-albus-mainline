# Moto Z2 Play (albus) stock Linux USB-RNDIS identity.
# Installed as /etc/usb-gadget.conf; consumed by sh/usb-gadget.

#------------------------------------------------------------------#

DEVICE_NAME=albus
USB_MANUFACTURER='Motorola Moto Z2 Play Linux'
USB_DEV_MAC=02:00:00:00:41:01
USB_HOST_MAC=02:00:00:00:41:02
USB_IP_CIDR=10.15.0.1/24
USB_IFACE=usb0

# DHCP range handed to the USB host lives in
# distros/debian/rootfs/etc/systemd/system/usb-dhcp.service
# (10.15.0.50-200/24) so the host learns how to reach the device at
# 10.15.0.1.

#------------------------------------------------------------------#
