# Mainline kernel configuration for the Motorola Moto Z2 Play (albus, MSM8953).
# This file documents the values scripts/kernel.sh builds with on this branch.
# To port to another device: commit the device files in the kernel repo, then
# edit this file to match.

#------------------------------------------------------------------#

# Kernel source checkout (shallow clone in scripts/kernel.sh).

KERNEL_URL="https://gitlab.com/vanadium-oss/msm8953/Mainline/linux.git"
KERNEL_REF="msm8953/latest"

#------------------------------------------------------------------#

# Cross-build contract. kernel.sh runs:
#   defconfig -> merge_config.sh msm8953.config motorola-albus.config ->
#   olddefconfig -> Image.gz dtbs modules

KERNEL_ARCH="arm64"
KERNEL_CROSS_COMPILE="aarch64-linux-gnu-"
KERNEL_BASE_CONFIG="defconfig"
KERNEL_CONFIG_1="arch/arm64/configs/msm8953.config"      # committed in the kernel repo
KERNEL_CONFIG_2="arch/arm64/configs/motorola-albus.config" # committed in the kernel repo

# The Debian rootfs has no initramfs; the essentials stay built-in
# (asserted inside scripts/kernel.sh):
#   CONFIG_EXT4_FS=y CONFIG_EXT4_FS_SECURITY=y
#   CONFIG_USB_CONFIGFS_RNDIS=y CONFIG_USB_CONFIGFS_NCM=y CONFIG_USB_CONFIGFS_ECM=y
#   CONFIG_USB_DWC3_QCOM=y CONFIG_KEYBOARD_GPIO=y

#------------------------------------------------------------------#

# Built DTB path inside the kernel source tree.

KERNEL_DTB="arch/arm64/boot/dts/qcom/msm8953-motorola-albus.dtb"
KERNEL_IMAGE_TARGET="Image.gz"

#------------------------------------------------------------------#

# Android boot image settings (lk2nd contract on msm8953).
# The rootfs boots from PARTLABEL=userdata so the boot image stays
# rootfs-agnostic (no UUID coupling). lk2nd decompresses the gzip'd kernel
# and scans appended FDTs right after the decompressed image; it selects the
# DTB matching qcom,msm-id/board-id.

KERNEL_BOOT_NAME="boot.img"
KERNEL_CMDLINE="root=PARTLABEL=userdata rw rootwait"
KERNEL_BOOT_HEADER_VERSION=0
KERNEL_BOOT_BASE="0x80000000"
KERNEL_BOOT_KERNEL_OFFSET="0x00008000"
KERNEL_BOOT_RAMDISK_OFFSET="0x01000000"
KERNEL_BOOT_SECOND_OFFSET="0x00f00000"
KERNEL_BOOT_TAGS_OFFSET="0x00000100"
KERNEL_BOOT_PAGE_SIZE=2048

# mkbootimg.py is vendored in this branch (AOSP writer, pinned file).

#------------------------------------------------------------------#

# Artifacts: workflow uploads `albus-mainline`
#   boot.img, boot.img.sha256, Image.gz, msm8953-motorola-albus.dtb,
#   modules.tar.gz, kernel-release.txt
# The `rootfs` branch consumes modules.tar.gz + kernel-release.txt from the
# latest successful run of this workflow.
