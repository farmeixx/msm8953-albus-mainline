# Moto Z2 Play (albus) firmware layout.
# Sourced by sh/firmware.sh.

#------------------------------------------------------------------#

# The firmware repository is cloned at build time; its SHA256SUMS is verified.
# FIRMWARE_SOURCE_DIR (environment) points the installer at an already
# available local tree instead, e.g. for offline builds.

FIRMWARE_URL="https://gitlab.com/vanadium-oss/msm8953/moto/albus/Mainline/albus-firmware.git"
FIRMWARE_REF=""  # Empty: repository default branch.
FIRMWARE_DEST="/lib/firmware"

#------------------------------------------------------------------#

# Copy whole source directories recursively (contents only).
# Format: repository-directory | destination relative to FIRMWARE_DEST

FIRMWARE_DIRS=(
  "wlan|qcom/msm8953/motorola/albus"
)

#------------------------------------------------------------------#

# Glob copies (each matching file, not the whole directory).
# Format: source-glob | destination directory relative to FIRMWARE_DEST
#  - wcnss: the remoteproc loader looks in the firmware root by default
#  - mba/modem/adsp/venus: firmware root (future remoteproc bring-up)
#  - a506_zap GPU: DT firmware-name path (qcom/msm8953/motorola/albus)

FIRMWARE_GLOBS=(
  "modem/image/a506_zap.*|qcom/msm8953/motorola/albus"
  "modem/image/wcnss.*|."
  "modem/image/mba.mbn|."
  "modem/image/modem.*|."
  "modem/image/adsp.*|."
  "modem/image/venus.*|."
)

#------------------------------------------------------------------#

# Additional paths requested by the WCN36xx driver / albus DT.

FIRMWARE_REQUIRED=(
  "wlan/WCNSS_qcom_wlan_nv.bin"
  "modem/image/wcnss.mdt"
  "modem/image/mba.mbn"
  "modem/image/modem.mdt"
  "modem/image/adsp.mdt"
  "modem/image/venus.mdt"
  "modem/image/a506_zap.mdt"
)

#------------------------------------------------------------------#
