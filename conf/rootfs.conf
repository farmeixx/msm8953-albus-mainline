# Rootfs image policy for the Moto Z2 Play (albus) Debian image.

#------------------------------------------------------------------#

# Fixed initial ext4 capacity; albus-resize grows the filesystem to fill the
# userdata partition on first boot. A smaller image is only published if ext4
# itself reports safe free space.

IMAGE_SIZE_MB="1024"
IMAGE_FREE_MIN_DEBIAN="64"

#------------------------------------------------------------------#

DEBIAN_SUITE="bookworm"
DEB_MIRROR="https://deb.debian.org/debian"

# dhclient family kept happy: matching host range lives in conf/usb.conf.
